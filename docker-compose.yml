# Runs the calendar backend and its own Postgres. The frontend remote and the platform run
# separately. The backend verifies delegated tokens against the platform JWKS,
# so the platform must be reachable at CALENDAR_CORE_JWKS_URL.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: calendar
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: calendar
    ports:
      - "5433:5432" # exposed for inspection; the backend reaches it in-network as db:5432
    volumes:
      - calendar-db:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U calendar -d calendar" ]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    ports:
      - "9090:9090"
    environment:
      CALENDAR_ADDR: ":9090"
      CALENDAR_DATABASE_URL: "postgres://calendar:dev@db:5432/calendar?sslmode=disable"
      # The `iss` the platform mints = its FLYSPACE_PUBLIC_URL. In the dev stack everything is
      # reached through the shell, so that is http://localhost:4200 — NOT core's listen port. Must
      # match exactly or the backend rejects the delegated token (401 auth.invalid).
      CALENDAR_CORE_ISSUER: "${CALENDAR_CORE_ISSUER:-http://localhost:8090}"
      # Where to fetch the platform's JWKS — independent of the issuer; host.docker.internal reaches
      # core's listen port on the host.
      CALENDAR_CORE_JWKS_URL: "${CALENDAR_CORE_JWKS_URL:-http://host.docker.internal:8090/.well-known/jwks.json}"
      CALENDAR_EXTENSION_ID: "net.flytegration.calendar"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  # Serves the built remote with permissive CORS so the shell can load it cross-origin. Build the
  # bundle on the host first (pnpm build) — the Angular/esbuild build does not run cleanly inside a
  # container, and serving the host build also keeps this image free of any registry dependency.
  remote:
    image: nginx:alpine
    volumes:
      - ./dist/template/browser:/usr/share/nginx/html:ro
      - ./remote.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "4201:4201"

volumes:
  calendar-db:
